name: Build Deploy and SonarQube

on:
  workflow_dispatch:

jobs:

  build:
    name: Build and Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install Maven
        run: sudo yum install maven -y

      - name: Build WAR
        run: mvn -B clean package

      - name: Deploy WAR to Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}

        run: |
          WAR=$(ls target/*.war | head -n 1)

          echo "WAR FILE: $WAR"
          echo "Deploying to: $TOMCAT_URL"

          curl -v -u "${TOMCAT_USER}:${TOMCAT_PASSWORD}" \
          --upload-file "$WAR" \
          "${TOMCAT_URL}/manager/text/deploy?path=/ecommerce-app&update=true"



    
  sonarqube:
    runs-on: self-hosted
    needs: [build]
    steps:
      - name: Sonarbue report
        run: mvn sonar:sonar