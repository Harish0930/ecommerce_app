name: simple build and deploy
on:
    workflow_dispatch:
jobs:
    full:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            
            - uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: 17
                cache: maven            

            - run: mvn -B clean package

            - name: Deploy WAR to tomcat
              env: 
                TOMCAT_URL: ${{secrets.TOMACT_URL}}
                TOMCAT_USER: ${{secrets.TOMCAT_USER}}
                TOMCAT_PASSWORD: ${{secrets.TOMCAT_PASSWORD}}
              run: |
                    WAR=$(ls target/*.war | head -n 1)

                    echo "WAR FILE: $WAR"
                    echo "Deploying to: $TOMCAT_URL"

                    curl -v -u "${TOMCAT_USER}:${TOMCAT_PASSWORD}" \
                    --upload-file "$WAR" \
                    "${TOMCAT_URL}/manager/text/deploy?path=/ecommerce-app&update=true"       

